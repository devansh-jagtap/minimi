<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1380" viewBox="0 0 2000 1380" role="img" aria-labelledby="title desc">
  <title id="title">Minimi system architecture</title>
  <desc id="desc">Architecture diagram showing the authenticated chat and research flow, plus document upload, indexing, and cross-chat retrieval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f8"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263d91"/><stop offset="1" stop-color="#5369dc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#27334d" flood-opacity=".10"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#5268d8"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#158b75"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#d18b24"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17233b} .title{font-size:48px;font-weight:750;letter-spacing:-1.4px}.subtitle{font-size:21px;fill:#64718a}.zoneTitle{font-size:19px;font-weight:700;letter-spacing:1.4px;fill:#69758b}.cardTitle{font-size:23px;font-weight:700}.body{font-size:18px;fill:#526078}.small{font-size:15px;fill:#6c7890}.chip{font-size:15px;font-weight:650}.flow{font-size:15px;font-weight:650;fill:#495875}.node{filter:url(#shadow)}
    </style>
  </defs>
  <rect width="2000" height="1380" fill="url(#bg)"/>
  <circle cx="1860" cy="80" r="145" fill="#dce5ff" opacity=".38"/><circle cx="90" cy="1320" r="185" fill="#d9f3eb" opacity=".38"/>

  <text x="78" y="91" class="title">Minimi</text>
  <text x="78" y="132" class="subtitle">System architecture · authenticated research, memory, and document retrieval</text>
  <rect x="1584" y="66" width="338" height="48" rx="24" fill="#fff" stroke="#dbe2ee"/>
  <circle cx="1612" cy="90" r="7" fill="#158b75"/><text x="1630" y="97" class="chip" fill="#40506c">IMPLEMENTED SYSTEM</text>

  <!-- zones -->
  <rect x="58" y="185" width="400" height="535" rx="26" fill="#ffffff" stroke="#dce3ef"/>
  <rect x="485" y="185" width="535" height="535" rx="26" fill="#ffffff" stroke="#dce3ef"/>
  <rect x="1048" y="185" width="425" height="535" rx="26" fill="#ffffff" stroke="#dce3ef"/>
  <rect x="1500" y="185" width="442" height="535" rx="26" fill="#ffffff" stroke="#dce3ef"/>
  <text x="88" y="226" class="zoneTitle">01 · CLIENT</text>
  <text x="515" y="226" class="zoneTitle">02 · APPLICATION</text>
  <text x="1078" y="226" class="zoneTitle">03 · MODEL + TOOLS</text>
  <text x="1530" y="226" class="zoneTitle">04 · EXTERNAL SERVICE</text>

  <!-- client cards -->
  <g class="node"><rect x="88" y="260" width="340" height="185" rx="20" fill="#f3f6ff" stroke="#cbd6ff" stroke-width="2"/>
    <rect x="110" y="283" width="44" height="44" rx="13" fill="#5369dc"/><path d="M123 305v-8m9 14v-20m9 14v-8" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="172" y="305" class="cardTitle">Research chat</text><text x="110" y="357" class="body">Prompt composer · file attachments</text><text x="110" y="385" class="body">Web search toggle · conversation history</text><text x="110" y="417" class="small">Browser session is sent with each request</text>
  </g>
  <g class="node"><rect x="88" y="470" width="340" height="176" rx="20" fill="#f6f8fc" stroke="#dce3ef" stroke-width="2"/>
    <text x="112" y="511" class="cardTitle">Live response view</text><text x="112" y="550" class="body">Streamed answer and citations</text><text x="112" y="579" class="body">Visible search activity and sources</text><text x="112" y="615" class="small">No private chain-of-thought is exposed</text>
  </g>

  <!-- app cards -->
  <g class="node"><rect x="515" y="260" width="475" height="78" rx="17" fill="#eff2ff" stroke="#cbd4fb" stroke-width="2"/>
    <circle cx="546" cy="299" r="12" fill="#5268d8"/><path d="M540 299l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="572" y="294" class="cardTitle">Clerk authentication</text><text x="572" y="319" class="small">Session identity becomes the owner scope</text>
  </g>
  <g class="node"><rect x="515" y="362" width="475" height="145" rx="20" fill="#f4f6ff" stroke="#cbd4fb" stroke-width="2"/>
    <text x="542" y="402" class="cardTitle">Next.js chat API</text><text x="542" y="437" class="body">Checks session · loads chat context</text><text x="542" y="466" class="body">Streams answer, citations, and search events</text><rect x="542" y="480" width="196" height="1" fill="#d9def3"/>
  </g>
  <g class="node"><rect x="515" y="530" width="475" height="145" rx="20" fill="#f6fbfa" stroke="#c4e5dc" stroke-width="2"/>
    <text x="542" y="571" class="cardTitle">Document API + retrieval</text><text x="542" y="606" class="body">Signs uploads · checks ownership</text><text x="542" y="635" class="body">Finds relevant excerpts across user chats</text>
  </g>

  <!-- AI cards -->
  <g class="node"><rect x="1078" y="260" width="365" height="150" rx="20" fill="#f3f6ff" stroke="#cbd6ff" stroke-width="2"/>
    <text x="1105" y="302" class="cardTitle">Vercel AI SDK</text><text x="1105" y="338" class="body">Orchestrates the answer stream</text><text x="1105" y="372" class="small">Exactly one callable tool: webSearch</text>
  </g>
  <g class="node"><rect x="1078" y="432" width="365" height="110" rx="20" fill="#effaf7" stroke="#bce4d8" stroke-width="2"/>
    <circle cx="1112" cy="476" r="15" fill="#168b75"/><path d="M1105 476h14m-7-7v14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1142" y="472" class="cardTitle">Google Gemini</text><text x="1142" y="506" class="small">Answer generation · embeddings · vision/OCR</text>
  </g>
  <g class="node"><rect x="1078" y="565" width="365" height="84" rx="18" fill="#fff8ed" stroke="#f0d7a7" stroke-width="2"/>
    <text x="1105" y="600" class="cardTitle">Research extraction</text><text x="1105" y="629" class="small">App-side follow-up after a searched answer</text>
  </g>

  <!-- external -->
  <g class="node"><rect x="1530" y="290" width="382" height="160" rx="22" fill="#fff8ed" stroke="#f0d7a7" stroke-width="2"/>
    <rect x="1555" y="314" width="48" height="48" rx="14" fill="#e7a234"/><path d="M1569 339l8-12 8 12m-8-12v21" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1620" y="339" class="cardTitle">Tavily web search</text><text x="1555" y="390" class="body">Returns snippets, URLs, and dates</text><text x="1555" y="421" class="small">Only available through webSearch</text>
  </g>
  <rect x="1530" y="480" width="382" height="156" rx="20" fill="#f7f8fb" stroke="#dce3ef"/>
  <text x="1555" y="522" class="cardTitle">Evidence captured</text><text x="1555" y="559" class="body">Source snippets support the response</text><text x="1555" y="589" class="body">Structured facts keep source and dates</text><text x="1555" y="618" class="small">Historical observations are append-only</text>

  <!-- lower band -->
  <rect x="58" y="758" width="1884" height="548" rx="28" fill="#f4f7fb" stroke="#dce3ef"/>
  <text x="90" y="802" class="zoneTitle">05 · DATA + DOCUMENTS</text>
  <g class="node"><rect x="92" y="850" width="515" height="378" rx="24" fill="#ffffff" stroke="#cbd4fb" stroke-width="2"/>
    <rect x="122" y="880" width="50" height="50" rx="15" fill="#5369dc"/><ellipse cx="147" cy="895" rx="13" ry="5" fill="none" stroke="#fff" stroke-width="2"/><path d="M134 895v17c0 7 26 7 26 0v-17m-26 8c0 7 26 7 26 0" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="190" y="913" class="cardTitle">LibSQL database</text><text x="122" y="973" class="body">Conversations and messages</text><text x="122" y="1008" class="body">Cross-chat memory + research evidence</text><text x="122" y="1043" class="body">Owner-scoped file metadata + job status</text><text x="122" y="1078" class="body">Document chunks + serialized embeddings</text>
    <rect x="122" y="1110" width="455" height="1" fill="#e3e8f1"/><text x="122" y="1150" class="small">Search and memory retrieval are user-scoped</text><text x="122" y="1182" class="small">Chunk similarity is computed in app code</text>
  </g>
  <g class="node"><rect x="730" y="850" width="475" height="378" rx="24" fill="#ffffff" stroke="#bce4d8" stroke-width="2"/>
    <circle cx="774" cy="909" r="24" fill="#168b75"/><path d="M765 909h18m-9-9v18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="815" y="917" class="cardTitle">Local document worker</text><text x="760" y="973" class="body">Claims queued jobs from LibSQL</text><text x="760" y="1008" class="body">Reads private originals from R2</text><text x="760" y="1043" class="body">Extracts PDF, DOCX, TXT, and images</text><text x="760" y="1078" class="body">Chunks content and creates embeddings</text>
    <rect x="760" y="1110" width="415" height="1" fill="#e3e8f1"/><text x="760" y="1150" class="small">Started with bun run dev, or bun run worker</text><text x="760" y="1182" class="small">Retrieved excerpts are treated as untrusted</text>
  </g>
  <g class="node"><rect x="1328" y="850" width="555" height="378" rx="24" fill="#ffffff" stroke="#f0d7a7" stroke-width="2"/>
    <rect x="1360" y="883" width="54" height="48" rx="11" fill="#e7a234"/><path d="M1372 898h30m-30 10h30m-30 10h21" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1435" y="916" class="cardTitle">Cloudflare R2</text><text x="1360" y="973" class="body">Private bucket stores original files</text><text x="1360" y="1008" class="body">Browser uploads with short-lived signed URL</text><text x="1360" y="1043" class="body">Server controls opaque object keys</text>
    <rect x="1360" y="1080" width="490" height="1" fill="#e3e8f1"/><text x="1360" y="1120" class="small">Deleting a conversation removes its attached files</text><text x="1360" y="1152" class="small">Cross-chat retrieval can use same-owner files</text>
  </g>

  <!-- connectors, drawn on top for clear direction -->
  <path d="M428 330H505" fill="none" stroke="#5268d8" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="438" y="316" class="flow">session</text>
  <path d="M428 393H505" fill="none" stroke="#5268d8" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="432" y="421" class="flow">chat request</text>
  <path d="M515 485H438" fill="none" stroke="#5268d8" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="438" y="477" class="flow">streamed answer</text>
  <path d="M990 424H1068" fill="none" stroke="#5268d8" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="993" y="408" class="flow">prompt + context</text>
  <path d="M1443 326H1520" fill="none" stroke="#d18b24" stroke-width="3" marker-end="url(#arrowAmber)"/><text x="1451" y="310" class="flow">webSearch</text>
  <path d="M1520 414H1443" fill="none" stroke="#d18b24" stroke-width="3" marker-end="url(#arrowAmber)"/><text x="1450" y="440" class="flow">results</text>
  <path d="M428 550H500" fill="none" stroke="#158b75" stroke-width="3" marker-end="url(#arrowGreen)"/><text x="433" y="536" class="flow">upload intent</text>
  <path d="M990 600H1068" fill="none" stroke="#158b75" stroke-width="3" marker-end="url(#arrowGreen)"/><text x="994" y="584" class="flow">app-side extraction</text>
  <path d="M550 675V840" fill="none" stroke="#5268d8" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="565" y="765" class="flow">owner-scoped data</text>
  <path d="M1260 565V550" fill="none" stroke="#158b75" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M1443 488H1482V780H1180V840" fill="none" stroke="#158b75" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrowGreen)"/><text x="1260" y="765" class="flow">Gemini embeddings</text>
  <path d="M720 1038H620" fill="none" stroke="#158b75" stroke-width="3" marker-end="url(#arrowGreen)"/><text x="615" y="1019" class="flow">chunks + status</text>
  <path d="M1318 1000H1215" fill="none" stroke="#d18b24" stroke-width="3" marker-end="url(#arrowAmber)"/><text x="1212" y="980" class="flow">worker reads file</text>

  <!-- footer and key -->
  <rect x="78" y="1319" width="1844" height="1" fill="#dce3ef"/>
  <path d="M108 1347h56" stroke="#5268d8" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="175" y="1353" class="small">Chat / application flow</text>
  <path d="M424 1347h56" stroke="#158b75" stroke-width="3" marker-end="url(#arrowGreen)"/><text x="491" y="1353" class="small">Document / Gemini processing</text>
  <path d="M820 1347h56" stroke="#d18b24" stroke-width="3" marker-end="url(#arrowAmber)"/><text x="887" y="1353" class="small">External search / object storage</text>
  <text x="1518" y="1353" class="small">Minimi · architecture overview</text>
</svg>
